<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/css/pico.min.css">
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHJP Baptismal Records</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <main class="container">
    <h2>Register</h2>
    <div id="themeSwitcher" class="secondary"></div>
    <form class="register-form" id="registerForm">
      <div class="grid">
        <label>
          Last Name
          <input type="text" id="lastname" name="lastname" required>
        </label>
        <label>
          First Name
          <input type="text" id="firstname" name="firstname" required>
        </label>
        <label>
          <div class="single-line-truncate">Middle Initial/Name</div>
          <input type="text" id="middle" name="middle">
        </label>
        <label>
          <div class="single-line-truncate">Date of First Communion</div>
          <input type="date" id="communion-date" name="communion-date" required>
        </label>
        <button type="submit">Register</button>
      </div>
    </form>

    <hr>

    <div>
      <h2>Search</h2>
      <form class="search-form" role="search">
        <input type="search" id="searchInput" name="query">
        <button type="submit">Search</button>
      </form>

      <div class="search-result">
        <table>
          <thead>
            <tr>
              <th>Date of First Communion</th>
              <th>Name</th>
              <th></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <dialog id="infoModal">
      <article>
        <header>
          <button aria-label="Close" rel="prev" id="closeInfoModal"></button>
          <p><strong>Record Info</strong></p>
        </header>
        <p><strong>Name:</strong> <span id="infoName"></span></p>
        <p><strong>Date of First Communion:</strong> <span id="infoDate"></span></p>
        <p><strong>Created:</strong> <span id="infoCreatedAt"></span></p>
      </article>
    </dialog>

    <dialog id="deleteModal">
      <article>
        <header>
          <button aria-label="Close" rel="prev" id="closeDeleteModal"></button>
          <p><strong>Delete Record</strong></p>
        </header>
        <p>Are you sure you want to delete this record?</p>
        <p><strong>THIS CANNOT BE UNDONE.</strong></p>
        <footer>
          <button id="cancelDelete" class="secondary">Cancel</button>
          <button id="confirmDelete">Delete</button>
        </footer>
      </article>
    </dialog>

    <dialog id="editModal">
      <article>
        <header>
          <button aria-label="Close" rel="prev" id="closeEditModal"></button>
          <p><strong>Edit Record</strong></p>
        </header>
        <form id="editForm">
          <input type="hidden" id="editId" name="id">
          <div class="grid">
            <label>
              Last Name
              <input type="text" id="editLastname" name="lastname" required>
            </label>
            <label>
              First Name
              <input type="text" id="editFirstname" name="firstname" required>
            </label>
            <label>
              Middle
              <input type="text" id="editMiddle" name="middle">
            </label>
            <label>
              <div class="single-line-truncate">Date of First Communion</div>
              <input type="date" id="editDofc" name="dofc" required>
            </label>
          </div>
          <button type="submit">Save Changes</button>
        </form>
      </article>
    </dialog>
  </main>
</body>

</html>
