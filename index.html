<!doctype html>
<html lang="en" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <link rel="stylesheet" href="/src/css/pico.min.css">
  <link rel="stylesheet" href="/src/styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHJP Baptismal Records</title>
  <script type="module" src="/src/main.ts" defer></script>
</head>

<body>
  <main class="container">
    <div>
      <form class="register-form">
        <h2>Register</h2>
        <div class="grid">
          <label>
            Last Name
            <input type="text" id="lastname" name="lastname" required>
          </label>
          <label>
            First Name
            <input type="text" id="firstname" name="firstname" required>
          </label>

          <label>
            <div class="single-line-truncate">Middle Initial/Name</div>
            <input type="text" id="middle" name="middle">
          </label>

          <label>
            <div class="single-line-truncate">Date of First Communion</div>
            <input type="date" id="communion-date" name="communion-date" required>
          </label>
          <button type="submit">Register</button>
        </div>
      </form>

      <hr>

      <div>
        <h2>Search</h2>
        <form class="search-form" role="search">
          <input type="search" id="query" name="query">
          <button type="submit">Search</button>
        </form>

        <div class="search-result">
          <table>
            <tbody>
              <tr>
                <th>Date of First Communion</th>
                <th>Name</th>
              </tr>
              <tr>
                <td>10/03/2003</td>
                <td>Lawrence Watkins</td>
                <td class="btn-group">
                  <button class="info-btn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                      class="lucide lucide-info-icon lucide-info">
                      <circle cx="12" cy="12" r="10" />
                      <path d="M12 16v-4" />
                      <path d="M12 8h.01" />
                    </svg>
                  </button>
                  <button class="edit-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" class="lucide lucide-square-pen-icon lucide-square-pen">
                      <path d="M12 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7" />
                      <path
                        d="M18.375 2.625a1 1 0 0 1 3 3l-9.013 9.014a2 2 0 0 1-.853.505l-2.873.84a.5.5 0 0 1-.62-.62l.84-2.873a2 2 0 0 1 .506-.852z" />
                    </svg></button>
                  <button class="delete-btn"><svg xmlns="http://www.w3.org/2000/svg" width="24" height="24"
                      viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                      stroke-linejoin="round" class="lucide lucide-trash2-icon lucide-trash-2">
                      <path d="M10 11v6" />
                      <path d="M14 11v6" />
                      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
                      <path d="M3 6h18" />
                      <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
                    </svg></button>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</body>

</html>
